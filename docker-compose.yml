services:
  postgres:
    image: postgres:16-alpine
    container_name: mercurio-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mercurio}
      POSTGRES_USER: ${POSTGRES_USER:-mercurio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mercurio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mercurio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mercurio} -d ${POSTGRES_DB:-mercurio}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mercurio-net

  redis:
    image: redis:7-alpine
    container_name: mercurio-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - mercurio_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mercurio-net

  localstack:
    image: localstack/localstack:3.7
    container_name: mercurio-localstack
    environment:
      - SERVICES=s3,sqs,sns,dynamodb
      - DEBUG=0
      - PERSISTENCE=1
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - mercurio_localstack:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mercurio-net

networks:
  mercurio-net:
    name: mercurio-net

volumes:
  mercurio_pgdata:
  mercurio_redisdata:
  mercurio_localstack:
